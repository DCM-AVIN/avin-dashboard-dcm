# Monta o Dashboard DCM a partir do SharePoint e publica no GitHub Pages, de hora em hora.
# Não depende de nenhum PC. Variáveis do repositório (Settings → Secrets and variables →
# Actions → Variables): AZURE_TENANT_ID e AZURE_CLIENT_ID (identificadores do app que a TI
# registrou; não são senhas). Sem elas, publica o HTML que o PC do editor envia para
# pc/index.html (job "do_pc", a cada envio) — modo provisório até a TI liberar o acesso.
# O site é protegido por senha: o HTML publicado vai CIFRADO (segredo AVIN_SITE_CHAVE, gravado
# por "Definir Senha do Site.bat"; o PC já envia pc/index.html cifrado).
name: Atualizar site

on:
  schedule:
    - cron: '7 * * * *'        # minuto 7 de cada hora (horário UTC; o GitHub pode atrasar alguns minutos)
  workflow_dispatch:            # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write               # token OIDC para entrar no Microsoft 365 sem segredo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo     # datas e horários do painel no horário de Brasília
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AVIN_SITE_CHAVE: ${{ secrets.AVIN_SITE_CHAVE }}   # chave da senha do site (o HTML vai cifrado)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Baixar do SharePoint e montar o site
        run: python -I nuvem/montar_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Provisório (sem o app da TI): publica o HTML enviado pelo PC; o horário não refaz nada
  do_pc:
    if: (vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f pc/index.html && touch pc/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pc

  publicar:
    needs: [montar, do_pc]
    if: always() && (needs.montar.result == 'success' || needs.do_pc.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
